spring:
  application:
    name: carpidi-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carpidi}
    username: ${SPRING_DATASOURCE_USERNAME:carpidi}
    password: ${SPRING_DATASOURCE_PASSWORD:carpidi_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson.default-property-inclusion: non_null
server.servlet.context-path: /api/v1
app:
  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    access-ttl-minutes: 15
    refresh-ttl-days: 14
