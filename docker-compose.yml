services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carpidi
      POSTGRES_USER: carpidi
      POSTGRES_PASSWORD: carpidi_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpidi -d carpidi"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carpidi
      SPRING_DATASOURCE_USERNAME: carpidi
      SPRING_DATASOURCE_PASSWORD: carpidi_dev
      APP_JWT_SECRET: change-this-development-secret-with-at-least-32-characters
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
